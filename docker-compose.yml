# The triage API and n8n, each in a Linux container. Ollama runs on the host, so its model stays loaded
# between restarts and can use the host's GPU.
services:
  triage:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:8b
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes the host reachable on Linux too

  n8n:
    image: n8nio/n8n:2.46.4
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_SECURE_COOKIE: "false"   # local use over plain http only
    volumes:
      - ./n8n/data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - triage
